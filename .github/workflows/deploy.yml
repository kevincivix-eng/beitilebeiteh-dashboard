name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # daily refresh of Airtable data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # The collector on the phone pushes a bundle per day into
      # data/whatsapp/live/. The chat exports are NOT in the repo — they are
      # gigabytes of private media — so this re-cuts only the live days and
      # keeps the exported listings exactly as the last local full run left
      # them. Nothing is committed back; the rebuilt files go straight into the
      # published site.
      - name: Rebuild WhatsApp listings from the live feed
        run: |
          node build/whatsapp/parse.js --live-only
          node build/whatsapp/members.js --live-only
          node build/whatsapp/extract.js
          node build/whatsapp/build-exp.js

      - name: Fetch fresh data (Airtable + SharePoint + Meta social)
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SHAREPOINT_XLSX_URL: ${{ secrets.SHAREPOINT_XLSX_URL }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: node build/fetch_data.js

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
