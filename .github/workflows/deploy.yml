name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # daily refresh of Airtable data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # The collector on the phone pushes a bundle per day into
      # data/whatsapp/live/. The chat exports are NOT in the repo — they are
      # gigabytes of private media — so this re-cuts only the live days and
      # keeps the exported listings exactly as the last local full run left
      # them. Nothing is committed back; the rebuilt files go straight into the
      # published site.
      - name: Rebuild WhatsApp listings from the live feed
        run: |
          node build/whatsapp/parse.js --live-only
          node build/whatsapp/members.js --live-only
          node build/whatsapp/extract.js
          node build/whatsapp/build-exp.js

      - name: Fetch fresh data (Airtable + SharePoint + Meta social)
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SHAREPOINT_XLSX_URL: ${{ secrets.SHAREPOINT_XLSX_URL }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: node build/fetch_data.js

      # These three move together, and are kept on current majors so that a
      # retired Node on the runners is never one of the things to rule out.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # deploy-pages intermittently reports "Found 0 artifact(s)" about the
      # artifact that uploaded seconds earlier — the one the REST API happily
      # lists under this very run. It is a fault on GitHub's side and it clears
      # by itself. Two attempts to name the cause were disproved by the runs
      # that followed: waiting for the API to list the artifact (it was listed,
      # the deploy failed anyway) and the actions being a major version behind
      # (upgraded, it still failed). So this does not explain it, it retries it,
      # which is the honest response to a fault that is intermittent and not
      # ours. If both attempts fail, the run goes red and means it.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Second attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
